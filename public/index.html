<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TickerTape India — NSE/BSE Terminal</title>
  <meta name="description" content="NSE/BSE stock terminal: live quotations, candlestick charts, screeners, fundamentals and technicals. Free, no login." />
  <meta name="theme-color" content="#f6f4ec" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  <style>
    :root{color-scheme:light;--bg:#f6f4ec;--panel:#fffdf7;--panel-2:#efe9d8;--ink:#181410;--ink-2:#5c564a;--ink-3:#8a8271;--line:#e0d9c3;--accent:#b45309;--accent-ink:#92400e;--up:#047857;--up-bg:#dff3e8;--down:#b91c1c;--down-bg:#fbe3e1;--amber:#f59e0b;--radius:8px}
    :root[data-theme='dark']{color-scheme:dark;--bg:#0c0d10;--panel:#14161b;--panel-2:#1d2027;--ink:#ece7d9;--ink-2:#a39e8f;--ink-3:#6b665a;--line:#262932;--accent:#f5a524;--accent-ink:#fbbf24;--up:#34d399;--up-bg:rgba(52,211,153,.13);--down:#f87171;--down-bg:rgba(248,113,113,.12)}
    *{box-sizing:border-box}html,body{padding:0;margin:0}
    body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-feature-settings:'tnum'}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
    #tape{background:#111;color:#f5f0df;overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--accent)}
    #tape .track{display:inline-flex;width:max-content;animation:tape 55s linear infinite;padding:7px 0}
    @keyframes tape{to{transform:translateX(-50%)}}
    .titem{display:inline-block;padding:0 20px;font-family:'IBM Plex Mono',monospace;font-size:12px}
    .titem .u{color:#4ade80}.titem .d{color:#f87171}
    .shell{display:flex;min-height:calc(100vh - 33px)}
    aside.side{width:228px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 33px)}
    .logo{padding:16px;font-weight:800;font-size:16px;letter-spacing:-.3px;border-bottom:1px solid var(--line);cursor:pointer}
    .logo b{color:var(--accent)}
    .logo small{display:block;font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:2px}
    nav.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
    nav.nav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--ink-2);font-size:13.5px;font-weight:600;padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;font-family:inherit}
    nav.nav button:hover{background:var(--panel-2);color:var(--ink)}
    nav.nav button.on{background:var(--ink);color:var(--bg)}
    .side-idx{padding:10px;border-top:1px solid var(--line);margin-top:auto;overflow:auto}
    .side-idx h4{margin:4px 4px 8px;font-size:10px;letter-spacing:1.5px;color:var(--ink-3)}
    .si{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:5px 4px;border-bottom:1px dotted var(--line)}
    .si:last-child{border-bottom:0}
    .maincol{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{display:flex;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
    .topbar .search{flex:1;max-width:520px;position:relative}
    .topbar input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 12px 9px 34px;font-size:13.5px;font-family:'IBM Plex Mono',monospace;outline:none}
    .topbar input:focus{border-color:var(--accent)}
    .topbar .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
    .results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:none;box-shadow:0 16px 40px -12px rgba(0,0,0,.3);z-index:50}
    .results.open{display:block}
    .results button{display:flex;width:100%;gap:10px;align-items:baseline;background:none;border:0;color:var(--ink);padding:9px 12px;cursor:pointer;font-size:13px;text-align:left;font-family:'IBM Plex Mono',monospace}
    .results button:hover{background:var(--panel-2)}
    .results .ex{margin-left:auto;color:var(--ink-3);font-size:11px}
    .icon-btn{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:15px;flex:none}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
    #modeBadge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
    main{flex:1;padding:20px;max-width:1180px;width:100%;margin:0 auto}
    .page-loading{padding:80px 0;text-align:center;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:13px}
    footer{border-top:1px solid var(--line);padding:14px 20px;color:var(--ink-3);font-size:11.5px;font-family:'IBM Plex Mono',monospace;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel)}
    .menu-btn{display:none}
    @media(max-width:860px){
      aside.side{position:fixed;z-index:40;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;height:100vh;box-shadow:20px 0 60px rgba(0,0,0,.3)}
      body.nav-open aside.side{transform:none}
      .menu-btn{display:grid}
      main{padding:14px}
    }
  </style>
  <script>!function(){try{var t=localStorage.getItem("tt-theme");if(t)document.documentElement.dataset.theme=t;else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}}();</script>
  <link rel="preload" href="app.js" as="script" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="tape" aria-hidden="true"><div class="track" id="tapeTrack"></div></div>
  <div class="shell">
    <aside class="side">
      <div class="logo" id="homeBtn">TICKER<b>TAPE</b><small>INDIA · NSE/BSE</small></div>
      <nav class="nav" id="mainNav">
        <button data-nav="market">▦&nbsp; Market</button>
        <button data-nav="screener">◈&nbsp; Screener</button>
        <button data-nav="watch">★&nbsp; Watchlist</button>
      </nav>
      <div class="side-idx"><h4>INDICES</h4><div id="sideIdx"><div style="color:var(--ink-3);font-size:12px">…</div></div></div>
    </aside>
    <div class="maincol">
      <div class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="search"><span class="mag">⌕</span><input id="search" type="search" placeholder="SEARCH SYMBOL OR COMPANY — e.g. RELIANCE, HDFCBANK…" autocomplete="off" aria-label="Search stocks" /><div class="results" id="results"></div></div>
        <span id="modeBadge">…</span>
        <button class="icon-btn" id="themeBtn" title="Night / day" aria-label="Toggle theme">◐</button>
      </div>
      <main id="app"><div class="page-loading">LOADING QUOTES ▮▮▮</div></main>
      <footer><span>TICKERTAPE INDIA · DATA: YAHOO FINANCE · NOT INVESTMENT ADVICE</span><span id="footStamp"></span></footer>
    </div>
  </div>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
